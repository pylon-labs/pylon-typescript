name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.1.0-alpha.1
        required: true

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tarball: ${{ steps.tag.outputs.tarball }}
      dist_tag: ${{ steps.tag.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag and create the release
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          tarball=$(npm pack --silent)
          prerelease=()
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
            # npm installs the latest dist-tag by default, so prereleases move
            # it until a stable release exists, then use their own label.
            current_latest=$(npm view @usepylon/sdk dist-tags.latest 2>/dev/null || true)
            if [[ -n "$current_latest" && "$current_latest" != *-* ]]; then
              dist_tag=$(echo "${VERSION#*-}" | cut -d. -f1)
            fi
          fi
          gh release create "v$VERSION" "$tarball" --generate-notes "${prerelease[@]}"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: package
          path: ${{ steps.tag.outputs.tarball }}

  # npm trusts this job through Trusted Publishing, which it can only be
  # configured for after the package's first, manual publish.
  publish:
    needs: release
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: package
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.release.outputs.tarball }}
          DIST_TAG: ${{ needs.release.outputs.dist_tag }}
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"
